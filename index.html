<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>DARTS COUNT-UP</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,"Helvetica Neue",sans-serif;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:white;
  background:#181818;
}

.screen{
  position:absolute;
  inset:0;
  display:none !important;
}

.screen.active{
  display:flex !important;
}

/* =========================
   START
========================= */

#startScreen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
  background:#050505;
}

.title{
  font-size:clamp(38px,7vw,80px);
  font-weight:900;
  letter-spacing:5px;
}

.roomBox{
  width:min(520px,85vw);
}

.roomBox input{
  width:100%;
  padding:18px;
  border-radius:10px;
  border:1px solid #444;
  background:#111;
  color:white;
  text-align:center;
  font-size:24px;
  outline:none;
}

.roleButtons{
  display:flex;
  gap:18px;
  width:min(650px,90vw);
}

.roleButtons button{
  flex:1;
  min-height:90px;
  border:1px solid #444;
  border-radius:12px;
  font-size:25px;
  font-weight:bold;
}

.roleButtons button:active{
  transform:scale(.97);
  background:#333;
}

/* =========================
   INPUT
========================= */

#inputScreen{
  flex-direction:column;
}

.inputHeader{
  height:105px;
  flex:none;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:10px 22px;
  background:#0c0c0c;
  border-bottom:1px solid #222;
}

.turnInfo{
  text-align:left;
}

.turnInfo small{
  display:block;
  color:#888;
  font-size:15px;
}

.turnInfo strong{
  font-size:42px;
  line-height:1;
}

.currentPlayer{
  text-align:center;
}

.currentPlayer small{
  display:block;
  color:#888;
  font-size:15px;
}

.currentPlayer strong{
  font-size:32px;
}

.throwInfo{
  text-align:right;
}

.throwInfo small{
  display:block;
  color:#888;
  font-size:15px;
}

.throwInfo strong{
  font-size:42px;
  line-height:1;
}

.inputMain{
  flex:1;
  min-height:0;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

/* ボード */

.boardWrap{
  width:min(90vh,90vw);
  height:min(90vh,90vw);
  max-width:900px;
  max-height:900px;
  position:relative;
}

#dartboard{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  user-select:none;
}

.boardSegment{
  stroke:none;
}

.boardNumber{
  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-weight:900;
  font-size:15px;
  fill:white;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
  paint-order:stroke;
  stroke:#000;
  stroke-width:.8px;
}

.hitMarker{
  pointer-events:none;
}

/* INPUT MENU */

.inputMenu{
  position:absolute;
  top:18px;
  right:18px;
  z-index:10;
}

.menuButton{
  width:62px;
  height:62px;
  border-radius:50%;
  background:#171717;
  border:1px solid #444;
  font-size:28px;
}

.menuPanel{
  position:absolute;
  right:0;
  top:72px;
  width:270px;
  padding:14px;
  border-radius:12px;
  background:#151515;
  border:1px solid #333;
  display:none;
  box-shadow:0 10px 40px #000;
}

.menuPanel.open{
  display:block;
}

.menuPanel button{
  width:100%;
  padding:14px;
  margin:4px 0;
  border-radius:8px;
  text-align:left;
}

.menuPanel button:active{
  background:#333;
}

.turnSetting{
  padding:12px 5px;
  color:#aaa;
}

.turnSetting input{
  width:100%;
  margin-top:8px;
}

/* =========================
   OUTPUT
========================= */

#outputScreen{
  flex-direction:column;
  background:#050505;
}

.outputHeader{
  flex:none;
  min-height:170px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#090909;
  border-bottom:1px solid #252525;
  position:relative;
}

.outputHeader .label{
  color:#888;
  font-size:20px;
  letter-spacing:3px;
}

.outputCurrentPlayer{
  font-size:clamp(42px,7vw,80px);
  font-weight:900;
  margin:5px 0;
}

.outputCurrentScore{
  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    serif;

  font-size:clamp(100px,16vw,190px);
  line-height:.85;
  font-weight:900;
  letter-spacing:-4px;
}

.outputLastScore{
  position:absolute;
  right:30px;
  bottom:20px;
  color:#777;
  font-size:22px;
}

.outputMain{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:30px;
}

.playerList{
  width:min(1200px,96vw);
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.playerRow{
  min-height:90px;
  display:grid;
  grid-template-columns:70px 1fr auto auto;
  align-items:center;
  gap:20px;
  padding:12px 28px;
  border-radius:14px;
  background:#111;
  border:1px solid #242424;
  transition:.2s;
}

.playerRow.current{
  background:#191600;
  border:2px solid #d8b800;
  box-shadow:
    0 0 15px rgba(255,215,0,.18),
    inset 0 0 15px rgba(255,215,0,.06);
}

.playerNo{
  color:#777;
  font-size:25px;
  text-align:center;
}

.playerName{
  font-size:clamp(25px,3vw,42px);
  font-weight:bold;
}

.playerTurnScore{
  color:#777;
  font-size:clamp(20px,2.5vw,32px);
  min-width:100px;
  text-align:right;
}

.playerTotal{
  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    serif;

  font-size:clamp(42px,6vw,76px);
  font-weight:900;
  min-width:170px;
  text-align:right;
}

/* =========================
   OUTPUT EFFECT
========================= */

#effectLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
}

#effectLayer.show{
  animation:effectFade .9s ease-out;
}

.effectText{
  font-family:
    "Bodoni 72",
    "Times New Roman",
    "Yu Mincho",
    serif;

  font-size:clamp(90px,17vw,220px);
  font-weight:900;
  letter-spacing:4px;
  text-shadow:
    0 0 15px #000,
    0 0 35px #000;
  transform:scale(.5);
}

#effectLayer.show .effectText{
  animation:effectPop .9s cubic-bezier(.1,.8,.2,1);
}

@keyframes effectPop{
  0%{
    transform:scale(.3);
    opacity:0;
  }

  25%{
    transform:scale(1.15);
    opacity:1;
  }

  55%{
    transform:scale(1);
    opacity:1;
  }

  100%{
    transform:scale(1.08);
    opacity:0;
  }
}

@keyframes effectFade{
  0%{opacity:1}
  75%{opacity:1}
  100%{opacity:0}
}

/* =========================
   PLAYER CHANGE
========================= */

#playerChange{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.8);
  pointer-events:none;
}

#playerChange.show{
  display:flex;
}

.changeText{
  font-size:clamp(50px,10vw,130px);
  font-weight:900;
  letter-spacing:8px;
  animation:changeIn .8s ease-out;
}

@keyframes changeIn{
  0%{
    opacity:0;
    transform:scale(.7);
  }

  40%{
    opacity:1;
    transform:scale(1.08);
  }

  100%{
    opacity:0;
    transform:scale(1);
  }
}

/* =========================
   AUDIO SETTINGS
========================= */

.audioSettings{
  position:fixed;
  right:20px;
  top:20px;
  z-index:300;
}

.audioButton{
  width:58px;
  height:58px;
  border-radius:50%;
  border:1px solid #444;
  background:#161616;
  font-size:25px;
}

.audioPanel{
  position:absolute;
  right:0;
  top:68px;
  width:min(370px,90vw);
  padding:18px;
  background:#151515;
  border:1px solid #333;
  border-radius:12px;
  display:none;
  box-shadow:0 15px 50px #000;
}

.audioPanel.open{
  display:block;
}

.audioPanel h3{
  margin:0 0 15px;
}

.audioItem{
  padding:10px 0;
  border-bottom:1px solid #292929;
}

.audioItem label{
  display:block;
  margin-bottom:7px;
  color:#bbb;
}

.audioItem input{
  width:100%;
  font-size:13px;
}

.audioStatus{
  margin-top:12px;
  color:#777;
  font-size:13px;
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-width:600px){

  .inputHeader{
    height:78px;
    padding:6px 10px;
  }

  .turnInfo strong,
  .throwInfo strong{
    font-size:29px;
  }

  .currentPlayer strong{
    font-size:20px;
  }

  .currentPlayer small,
  .turnInfo small,
  .throwInfo small{
    font-size:10px;
  }

  .boardWrap{
    width:96vw;
    height:96vw;
  }

  .outputHeader{
    min-height:145px;
  }

  .outputLastScore{
    right:12px;
    bottom:8px;
    font-size:14px;
  }

  .outputMain{
    padding:10px;
  }

  .playerRow{
    grid-template-columns:35px 1fr auto;
    gap:8px;
    padding:8px 12px;
    min-height:70px;
  }

  .playerTurnScore{
    display:none;
  }

  .playerTotal{
    min-width:80px;
    font-size:40px;
  }

  .playerName{
    font-size:22px;
  }

  .playerNo{
    font-size:16px;
  }
}

/* 一投ごとの履歴と首位表示 */
.topPrayer{
  display:inline-block;
  flex:none;
  margin-left:10px;
  padding:4px 7px;
  border:1px solid #d8b800;
  border-radius:5px;
  color:#f0d75b;
  font:700 clamp(11px,1.15vw,17px)/1.2 Arial,sans-serif;
  letter-spacing:0;
  vertical-align:middle;
  white-space:nowrap;
}
.playerName{
  min-width:0;
  display:flex;
  align-items:center;
}
.playerNameText{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.outputHistoryButton{
  position:absolute;
  left:20px;
  top:20px;
  padding:10px 14px;
  border:1px solid #444;
  border-radius:8px;
  font-size:15px;
  cursor:pointer;
}
#menuPanel{
  max-height:calc(100dvh - 185px);
  overflow-y:auto;
}
#throwHistoryDialog{
  width:min(940px,94vw);
  max-height:86dvh;
  padding:0;
  border:1px solid #444;
  border-radius:12px;
  background:#111;
  color:#fff;
}
#throwHistoryDialog::backdrop{background:rgba(0,0,0,.8);}
.historyHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:18px 20px;
  border-bottom:1px solid #333;
}
.historyHeader h2{margin:0;font-size:22px;}
.historyHeader button{
  padding:10px 14px;
  border:1px solid #444;
  border-radius:7px;
  cursor:pointer;
}
.historyBody{max-height:calc(86dvh - 80px);overflow:auto;padding:0 20px 20px;}
.historyNote{color:#aaa;font-size:14px;line-height:1.6;}
.historyTable{width:100%;border-collapse:collapse;white-space:nowrap;}
.historyTable th,.historyTable td{
  padding:12px 10px;
  border-bottom:1px solid #292929;
  text-align:left;
}
.historyTable th{color:#aaa;font-size:13px;}
.historyTable td{font-size:16px;}
.historyTable .historyPoints{text-align:right;font-variant-numeric:tabular-nums;}

/* 4人以上のときだけ、下の点数欄を左右2列にする。 */
.playerList.split{
  width:100%;
  max-width:none;
  height:auto;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(var(--player-rows),minmax(82px,auto));
  align-content:start;
  gap:10px;
}
.playerList.split .playerRow{
  min-width:0;
  min-height:82px;
  grid-template-columns:32px minmax(0,1fr) auto;
  grid-template-rows:1fr auto;
  column-gap:12px;
  row-gap:2px;
  padding:10px 16px;
}
.playerList.split .playerNo{grid-column:1;grid-row:1 / 3;font-size:20px;}
.playerList.split .playerName{
  grid-column:2;
  grid-row:1;
  align-self:end;
  font-size:clamp(18px,2.25vw,34px);
}
.playerList.split .playerTurnScore{
  grid-column:2;
  grid-row:2;
  min-width:0;
  text-align:left;
  align-self:start;
  font-size:clamp(14px,2vh,22px);
}
.playerList.split .playerTotal{
  grid-column:3;
  grid-row:1 / 3;
  min-width:0;
  font-size:clamp(36px,6vh,76px);
  line-height:1;
}
.playerList.split .topPrayer{margin-left:7px;padding:3px 5px;font-size:clamp(10px,1vw,15px);}
@media(max-width:900px){
  .playerList.split .playerRow{padding:10px;column-gap:8px;grid-template-columns:23px minmax(0,1fr) auto;}
  .playerList.split .playerName{font-size:18px;}
  .playerList.split .playerTotal{font-size:38px;}
  .playerList.split .playerNo{font-size:16px;}
}
@media(max-width:600px){
  .outputHistoryButton{left:10px;top:10px;padding:7px 10px;font-size:13px;}
  .outputCurrentPlayer .topPrayer{margin-left:6px;padding:3px 5px;font-size:11px;}
  .playerList.split .playerRow{
    grid-template-columns:22px minmax(0,1fr);
    grid-template-rows:auto 1fr;
    min-height:82px;
    padding:8px;
    row-gap:7px;
  }
  .playerList.split .playerName{grid-column:1 / 3;grid-row:1;font-size:16px;align-self:center;}
  .playerList.split .playerNo{grid-column:1;grid-row:2;}
  .playerList.split .playerTotal{grid-column:2;grid-row:2;font-size:36px;}
  .playerList.split .playerTurnScore{display:none;}
  .playerList.split .topPrayer{margin-left:4px;padding:2px 3px;font-size:10px;}
  .historyHeader{padding:12px;}
  .historyHeader h2{font-size:18px;}
  .historyBody{padding:0 12px 12px;}
}
</style>
</head>

<body>

<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

  <div class="title">DARTS</div>

  <div class="roomBox">
    <input
      id="roomInput"
      type="text"
      placeholder="ROOM NAME"
      autocomplete="off">
  </div>

  <div class="roleButtons">
    <button id="inputButton">INPUT</button>
    <button id="outputButton">OUTPUT</button>
  </div>

</div>


<!-- =========================
     INPUT SCREEN
========================= -->

<div id="inputScreen" class="screen">

  <div class="inputHeader">

    <div class="turnInfo">
      <small>REMAINING TURNS</small>
      <strong id="remainingTurns">10</strong>
    </div>

    <div class="currentPlayer">
      <small>CURRENT PLAYER</small>
      <strong id="inputPlayerName">PLAYER 1</strong>
    </div>

    <div class="throwInfo">
      <small>REMAINING THROWS</small>
      <strong id="remainingThrows">3</strong>
    </div>

  </div>

  <div class="inputMain">

    <div class="inputMenu">

      <button class="menuButton" id="menuButton">☰</button>

      <div class="menuPanel" id="menuPanel">

        <button id="addPlayerButton">
          ＋ プレイヤー追加
        </button>

        <button id="deletePlayerButton">
          − 現在のプレイヤー削除
        </button>

        <button id="resetButton">
          スコアリセット
        </button>

        <div class="turnSetting">
          最大ターン数
          <input
            id="turnLimitInput"
            type="number"
            min="1"
            max="99"
            value="10">
        </div>

        <button id="applyTurnButton">
          ターン数を変更
        </button>

        <button id="inputHistoryButton" data-open-history>
          一投ごとの履歴
        </button>

      </div>

    </div>

    <div class="boardWrap">

      <svg
        id="dartboard"
        viewBox="0 0 300 300"
        preserveAspectRatio="xMidYMid meet"
        xmlns="http://www.w3.org/2000/svg">

        <g id="boardSegments"></g>
        <g id="boardNumbers"></g>
        <g id="hitMarkers"></g>

      </svg>

    </div>

  </div>

</div>


<!-- =========================
   OUTPUT SCREEN
========================= -->

<div id="outputScreen" class="screen">

  <div class="outputHeader">

    <button class="outputHistoryButton" id="outputHistoryButton" data-open-history>履歴</button>

    <div class="label">CURRENT PLAYER</div>

    <div
      class="outputCurrentPlayer"
      id="outputCurrentPlayer">
      PLAYER 1
    </div>

    <div
      class="outputCurrentScore"
      id="outputCurrentScore">
      0
    </div>

    <div
      class="outputLastScore"
      id="outputLastScore">
      —
    </div>

  </div>

  <div class="outputMain">

    <div
      class="playerList"
      id="playerList">
    </div>

  </div>

</div>


<!-- =========================
   EFFECTS
========================= -->

<div id="effectLayer">
  <div class="effectText" id="effectText"></div>
</div>

<div id="playerChange">
  <div class="changeText">PLAYER CHANGE</div>
</div>


<!-- =========================
   AUDIO
========================= -->

<div
  class="audioSettings"
  id="audioSettings"
  style="display:none">

  <button
    class="audioButton"
    id="audioButton">
    🔊
  </button>

  <div class="audioPanel" id="audioPanel">

    <h3>音声設定</h3>

    <div class="audioItem">
      <label>通常得点</label>
      <input
        type="file"
        id="audioNormal"
        accept="audio/*">
    </div>

    <div class="audioItem">
      <label>BULL</label>
      <input
        type="file"
        id="audioBull"
        accept="audio/*">
    </div>

    <div class="audioItem">
      <label>TRIPLE</label>
      <input
        type="file"
        id="audioTriple"
        accept="audio/*">
    </div>

    <div class="audioItem">
      <label>DOUBLE</label>
      <input
        type="file"
        id="audioDouble"
        accept="audio/*">
    </div>

    <div class="audioItem">
      <label>PLAYER CHANGE</label>
      <input
        type="file"
        id="audioChange"
        accept="audio/*">
    </div>

    <div class="audioStatus" id="audioStatus">
      音声ファイルを選択してください
    </div>

  </div>

</div>


<dialog id="throwHistoryDialog" aria-labelledby="throwHistoryTitle">
  <div class="historyHeader">
    <h2 id="throwHistoryTitle">一投ごとの履歴</h2>
    <button id="closeHistoryButton" type="button">閉じる</button>
  </div>
  <div class="historyBody">
    <p class="historyNote" id="historyNote"></p>
    <table class="historyTable">
      <thead><tr>
        <th>ターン</th><th>投目</th><th>プレイヤー</th><th>結果</th>
        <th class="historyPoints">得点</th><th class="historyPoints">累計</th>
      </tr></thead>
      <tbody id="throwHistoryRows"></tbody>
    </table>
  </div>
</dialog>

<script>
/* =========================================================
   BASIC UI
========================================================= */

const startScreen = document.getElementById("startScreen");
const inputScreen = document.getElementById("inputScreen");
const outputScreen = document.getElementById("outputScreen");

const roomInput = document.getElementById("roomInput");

let selectedRole = null;
let roomName = "";


/* =========================================================
   SCREEN SWITCH
========================================================= */

function showScreen(screen){

  startScreen.style.display = "none";

  inputScreen.classList.remove("active");
  outputScreen.classList.remove("active");

  if(screen === "input"){
    inputScreen.classList.add("active");
  }

  if(screen === "output"){
    outputScreen.classList.add("active");
  }

}


document.getElementById("inputButton").addEventListener("click",()=>{

  roomName = roomInput.value.trim();

  if(!roomName){
    alert("ROOM NAMEを入力してください");
    return;
  }

  selectedRole = "input";

  showScreen("input");

  initializeInput();

});


document.getElementById("outputButton").addEventListener("click",()=>{

  roomName = roomInput.value.trim();

  if(!roomName){
    alert("ROOM NAMEを入力してください");
    return;
  }

  selectedRole = "output";

  showScreen("output");

  document.getElementById("audioSettings").style.display = "block";

  initializeOutput();

});


/* =========================================================
   DARTBOARD
========================================================= */

const svg = document.getElementById("dartboard");
const segmentLayer = document.getElementById("boardSegments");
const numberLayer = document.getElementById("boardNumbers");
const hitLayer = document.getElementById("hitMarkers");

const CX = 150;
const CY = 150;

const OUTER_RADIUS = 135;

/*
  見た目の半径
*/
const DOUBLE_IN = 116;
const DOUBLE_OUT = 135;

const TRIPLE_IN = 68;
const TRIPLE_OUT = 79;

const OUTER_BULL = 20;
const INNER_BULL = 10;

const numbers = [
  20,1,18,4,13,6,10,15,2,17,
  3,19,7,16,8,11,14,9,12,5
];

function polarPoint(radius, degrees){

  const rad = degrees * Math.PI / 180;

  return {
    x: CX + radius * Math.sin(rad),
    y: CY - radius * Math.cos(rad)
  };

}


function wedgePath(r1,r2,a1,a2){

  const p1 = polarPoint(r2,a1);
  const p2 = polarPoint(r2,a2);

  const p3 = polarPoint(r1,a2);
  const p4 = polarPoint(r1,a1);

  return `
    M ${p1.x} ${p1.y}
    A ${r2} ${r2} 0 0 1 ${p2.x} ${p2.y}
    L ${p3.x} ${p3.y}
    A ${r1} ${r1} 0 0 0 ${p4.x} ${p4.y}
    Z
  `;
}


/*
  ボード描画

  線を使わず、完全に面だけで構成。
*/

function buildDartboard(){

  segmentLayer.innerHTML = "";
  numberLayer.innerHTML = "";

  for(let i=0;i<20;i++){

    const centerAngle = i * 18;

    const a1 = centerAngle - 9;
    const a2 = centerAngle + 9;

    /*
      20/1/18...の白黒
    */

    const base = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    base.setAttribute(
      "d",
      wedgePath(0,OUTER_RADIUS,a1,a2)
    );

    base.setAttribute(
      "fill",
      i % 2 === 0 ? "#111111" : "#eeeeee"
    );

    base.classList.add("boardSegment");

    segmentLayer.appendChild(base);


    /*
      TRIPLE
    */

    const triple = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    triple.setAttribute(
      "d",
      wedgePath(TRIPLE_IN,TRIPLE_OUT,a1,a2)
    );

    triple.setAttribute(
      "fill",
      i % 2 === 0 ? "#671919" : "#174c37"
    );

    triple.classList.add("boardSegment");

    segmentLayer.appendChild(triple);


    /*
      DOUBLE
    */

    const doubleRing = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    doubleRing.setAttribute(
      "d",
      wedgePath(DOUBLE_IN,DOUBLE_OUT,a1,a2)
    );

    doubleRing.setAttribute(
      "fill",
      i % 2 === 0 ? "#671919" : "#174c37"
    );

    doubleRing.classList.add("boardSegment");

    segmentLayer.appendChild(doubleRing);


    /*
      数字

      数字はボードの外周より少し内側。
      これで隠れにくい。
    */

    const p = polarPoint(143,centerAngle);

    const text = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

    text.setAttribute("x",p.x);
    text.setAttribute("y",p.y);

    text.textContent = numbers[i];

    text.classList.add("boardNumber");

    numberLayer.appendChild(text);

  }


  /*
    OUTER BULL
  */

  const outerBull =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  outerBull.setAttribute("cx",CX);
  outerBull.setAttribute("cy",CY);
  outerBull.setAttribute("r",OUTER_BULL);
  outerBull.setAttribute("fill","#174c37");

  segmentLayer.appendChild(outerBull);


  /*
    INNER BULL
  */

  const innerBull =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  innerBull.setAttribute("cx",CX);
  innerBull.setAttribute("cy",CY);
  innerBull.setAttribute("r",INNER_BULL);
  innerBull.setAttribute("fill","#671919");

  segmentLayer.appendChild(innerBull);

}


/* =========================================================
   ★ 正確なタップ座標変換
========================================================= */

function getBoardPoint(event){

  const rect = svg.getBoundingClientRect();

  /*
    clientX / clientY は画面上のピクセル。

    SVGは300×300のviewBox。

    そこで表示サイズに応じて
    正確に300×300へ変換する。
  */

  const x =
    (event.clientX - rect.left)
    * 300
    / rect.width;

  const y =
    (event.clientY - rect.top)
    * 300
    / rect.height;

  return {x,y};

}


/* =========================================================
   SCORE CALCULATION
========================================================= */

function calculateScore(x,y){

  const dx = x - CX;
  const dy = y - CY;

  const radius =
    Math.sqrt(dx*dx + dy*dy);


  /*
    ボード外
  */

  if(radius > OUTER_RADIUS){
    return null;
  }


  /*
    BULL

    見た目より少し判定を広くする。
    タップしやすさを確保。
  */

  if(radius <= 12){

    return {
      score:50,
      label:"BULL",
      type:"bull"
    };

  }


  /*
    OUTER BULL
  */

  if(radius <= 22){

    return {
      score:25,
      label:"25",
      type:"outerBull"
    };

  }


  /*
    角度

    0° = 真上

    20の中心が真上になるように
    9°ずつ補正している。

    これが以前のズレの主要部分を
    修正している。
  */

  let angle =
    Math.atan2(dx,-dy)
    * 180
    / Math.PI;

  if(angle < 0){
    angle += 360;
  }


  /*
    20分割

    各セグメントは18°。

    セグメント中央を基準にするため
    +9°してから18°で割る。
  */

  const index =
    Math.floor((angle + 9) / 18) % 20;

  const number = numbers[index];


  /*
    TRIPLE
  */

  if(
    radius >= TRIPLE_IN &&
    radius <= TRIPLE_OUT
  ){

    return {
      score:number * 3,
      label:"T"+(number*3),
      type:"triple",
      number
    };

  }


  /*
    DOUBLE
  */

  if(
    radius >= DOUBLE_IN &&
    radius <= DOUBLE_OUT
  ){

    return {
      score:number * 2,
      label:"D"+(number*2),
      type:"double",
      number
    };

  }


  /*
    SINGLE
  */

  return {
    score:number,
    label:String(number),
    type:"single",
    number
  };

}


/* =========================================================
   HIT MARKER
========================================================= */

function addHitMarker(x,y,result){

  const marker =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

  marker.setAttribute("cx",x);
  marker.setAttribute("cy",y);
  marker.setAttribute("r","5");

  marker.setAttribute(
    "fill",
    "white"
  );

  marker.setAttribute(
    "stroke",
    "black"
  );

  marker.setAttribute(
    "stroke-width",
    "2"
  );

  marker.classList.add("hitMarker");

  hitLayer.appendChild(marker);

}


/* =========================================================
   BOARD TOUCH
========================================================= */

svg.addEventListener("pointerdown",(event)=>{

  event.preventDefault();

  if(!gameState){
    return;
  }

  if(selectedRole !== "input" || gameState.state.finished || isProcessingThrow){
    return;
  }


  /*
    ★ ここで必ずSVG座標に変換
  */

  const point = getBoardPoint(event);

  const result =
    calculateScore(
      point.x,
      point.y
    );


  if(!result){
    return;
  }


  /*
    ヒット位置を表示
  */

  addHitMarker(
    point.x,
    point.y,
    result
  );


  /*
    スコアを送信
  */

  const marker = hitLayer.lastElementChild;
  processThrow(
    result.score,
    result.label,
    result.type
  ).then(accepted=>{
    if(!accepted && marker){
      marker.remove();
    }
  });

});

}


/* =========================================================
   WAIT FIREBASE
========================================================= */

function waitForFirebase(){

  return new Promise(resolve=>{

    if(isFirebaseReady){
      resolve();
      return;
    }

    let count = 0;

    const timer =
      setInterval(()=>{

        count++;

        if(isFirebaseReady){

          clearInterval(timer);
          resolve();

        }

        if(count > 100){

          clearInterval(timer);
          resolve();

        }

      },100);

  });

}


/* =========================================================
   FIREBASE SYNC
========================================================= */

async function startFirebaseSync(){

  if(!roomName){
    return;
  }

  roomRef =
    window.firebaseRef(
      db,
      "rooms/" +
      encodeURIComponent(roomName)
    );


  /*
    OUTPUTが先に開かれた場合でも
    待機できるようにする。
  */

  window.firebaseOnValue(
    roomRef,
    snapshot=>{

      const data = snapshot.val();

      if(!data){

        if(selectedRole === "input"){

          const initial =
            createInitialState();

          window.firebaseSet(
            roomRef,
            initial
          );

        }

        return;
      }


      gameState = data;

      updateAllUI();

    }

  );

}


/* =========================================================
   PROCESS THROW
========================================================= */

async function processThrow(score,label,type){

  if(
    selectedRole !== "input" || !gameState || !roomRef ||
    gameState.state.finished || isProcessingThrow
  ){
    return false;
  }

  const state = gameState.state;
  const currentId = state.currentPlayerId;
  const player = gameState.players[currentId];
  if(!player){
    return false;
  }

  isProcessingThrow = true;
  try{
    const newScore = Number(player.score || 0) + score;
    const newTurnScore = Number(player.turnScore || 0) + score;
    const throwNumber = Number(state.throwNumber || 0) + 1;
    const effectId = Math.max(Date.now(),Number(state.effectId || 0) + 1);
    const updates = {
      ["players/"+currentId+"/score"]:newScore,
      ["players/"+currentId+"/turnScore"]:newTurnScore,
      "state/throwNumber":throwNumber,
      "state/lastScore":score,
      "state/lastLabel":label,
      "state/lastType":type,
      "state/effectId":effectId
    };

    if(throwNumber >= 3){
      finishTurn(updates);
    }

    // 得点・履歴・演出IDは同じ更新で保存する。3投目も交代前の投者に紐づける。
    updates["history/"+effectId] = {
      id:effectId,
      at:Date.now(),
      playerId:currentId,
      playerName:player.name,
      turn:Number(gameState.currentTurn || 1),
      throwNumber,
      score,
      label,
      type,
      total:newScore,
      turnTotal:newTurnScore,
      changeId:Number(updates["state/changeId"] || 0),
      nextPlayerId:updates["state/currentPlayerId"] || currentId,
      nextTurn:Number(updates.currentTurn || gameState.currentTurn || 1),
      finished:!!updates["state/finished"]
    };

    await window.firebaseUpdate(roomRef,updates);
    return true;
  }catch(error){
    console.error("Throw update failed:",error);
    alert("得点を保存できませんでした。接続を確認して、もう一度入力してください。");
    return false;
  }finally{
    isProcessingThrow = false;
  }
}


/* =========================================================
   FINISH TURN
========================================================= */

function finishTurn(updates){

  const players =
    Object.entries(
      gameState.players || {}
    )
    .sort(
      (a,b)=>
        Number(a[1].order || 0)
        -
        Number(b[1].order || 0)
    );


  const currentIndex =
    players.findIndex(
      ([id]) =>
        id === gameState.state.currentPlayerId
    );


  let nextIndex =
    currentIndex + 1;

  let nextTurn =
    Number(gameState.currentTurn || 1);


  /*
    全員終了
  */

  if(nextIndex >= players.length){

    nextIndex = 0;
    nextTurn++;

  }


  /*
    ターン終了判定

    最大ターンを超えたら終了
  */

  if(nextTurn > Number(gameState.maxTurns || 10)){

    updates[
      "state/finished"
    ] = true;

    updates[
      "state/throwNumber"
    ] = 3;

    return;

  }


  const nextPlayerId =
    players[nextIndex][0];


  updates[
    "currentTurn"
  ] = nextTurn;


  updates[
    "state/currentPlayerId"
  ] = nextPlayerId;


  updates[
    "state/throwNumber"
  ] = 0;


  /*
    次のプレイヤーの
    今ターンの点数を0に戻す
  */

  updates[
    "players/" +
    nextPlayerId +
    "/turnScore"
  ] = 0;


  /*
    Player Change用ID

    booleanではなく数字を増やす方式。
    複数OUTPUT端末でもイベントを
    取りこぼしにくい。
  */

  updates[
    "state/changeId"
  ] =
    Math.max(Date.now(),Number(gameState.state.changeId || 0) + 1);


  /*
    次のプレイヤーへ交代するタイミングで
    現在のプレイヤーのヒット跡を消す。
  */

  hitLayer.innerHTML = "";

}

/* =========================================================
   DELETE PLAYER
========================================================= */

document.getElementById(
  "deletePlayerButton"
).addEventListener(
  "click",
  async ()=>{

    if(!gameState){
      return;
    }

    const players =
      Object.entries(
        gameState.players || {}
      )
      .sort(
        (a,b)=>
          a[1].order -
          b[1].order
      );


    if(players.length <= 1){
      alert("プレイヤーは1人以上必要です");
      return;
    }


    const currentId =
      gameState.state.currentPlayerId;


    const newPlayers =
      {};

    let order = 0;

    for(const [id,p] of players){

      if(id === currentId){
        continue;
      }

      newPlayers[id] = {
        ...p,
        order:order++
      };

    }


    const firstId =
      Object.keys(newPlayers)[0];


    await window.firebaseUpdate(
      roomRef,
      {
        players:newPlayers,
        "state/currentPlayerId":firstId,
        "state/throwNumber":0
      }
    );

  }
);

document.getElementById(

    const first =

          a[1].order -

    await window.firebaseUpdate(
      roomRef,
      {
        players,
        currentTurn:1,
        history:null,
        "state/effectId":0,
        "state/resetId":Math.max(Date.now(),Number(gameState.state.resetId || 0) + 1),

        "state/currentPlayerId":
          first[0],

        "state/throwNumber":0,

        "state/lastScore":null,

        "state/lastLabel":"",

/* =========================================================
   OUTPUT UI
========================================================= */

let lastChangeId = 0;
let lastEffectId = 0;
let lastResetId = 0;
let outputInitialized = false;
let previousPlayerIds = [];
let seenHistoryIds = new Set();
let outputQueue = [];
let outputBusy = false;
let outputGeneration = 0;
const playbackCancellations = new Set();

function getThrowHistory(data = gameState){
  return Object.values(data && data.history || {})
    .filter(h=>h && Number.isFinite(Number(h.id)))
    .sort((a,b)=>Number(a.id)-Number(b.id));
}

function topPrayerBadge(isTop){
  return isTop ? '<span class="topPrayer">TOP Prayer</span>' : '';
}

function renderOutputState(data,throwEvent = null){
  if(!data || !data.state){
    return;
  }

  const state = data.state;
  const currentId = throwEvent ? throwEvent.playerId : state.currentPlayerId;
  const players = Object.entries(data.players || {})
    .sort((a,b)=>Number(a[1].order || 0)-Number(b[1].order || 0))
    .map(([id,p])=>[id,throwEvent && id === throwEvent.playerId
      ? {...p,score:throwEvent.total,turnScore:throwEvent.turnTotal}
      : p]);
  const currentPlayer = players.find(([id])=>id === currentId)?.[1];
  if(!currentPlayer){
    return;
  }

  const topScore = Math.max(...players.map(([,p])=>Number(p.score || 0)));
  document.getElementById("outputCurrentPlayer").innerHTML =
    escapeHTML(currentPlayer.name) +
    topPrayerBadge(Number(currentPlayer.score || 0) === topScore);
  document.getElementById("outputCurrentScore").textContent = currentPlayer.score || 0;
  document.getElementById("outputLastScore").textContent =
    (throwEvent ? throwEvent.label : state.lastLabel) || "—";

  const list = document.getElementById("playerList");
  list.classList.toggle("split",players.length >= 4);
  list.style.setProperty("--player-rows",Math.ceil(players.length / 2));
  list.innerHTML = "";

  players.forEach(([id,p],index)=>{
    const row = document.createElement("div");
    row.className = "playerRow" + (id === currentId ? " current" : "");
    row.dataset.playerId = id;
    row.innerHTML = `
      <div class="playerNo">${index+1}</div>
      <div class="playerName">
        <span class="playerNameText" title="${escapeHTML(p.name)}">${escapeHTML(p.name)}</span>
        ${topPrayerBadge(Number(p.score || 0) === topScore)}
      </div>
      <div class="playerTurnScore">+${Number(p.turnScore || 0)}</div>
      <div class="playerTotal">${Number(p.score || 0)}</div>
    `;
    list.appendChild(row);
  });
}

function cancelOutputPlayback(){
  outputGeneration++;
  outputQueue = [];
  outputBusy = false;
  for(const cancel of Array.from(playbackCancellations)){
    cancel();
  }
}

function updateOutputUI(){
  if(!gameState || !gameState.state){
    return;
  }

  const state = gameState.state;
  const history = getThrowHistory();
  const resetId = Number(state.resetId || 0);
  const playerIds = Object.keys(gameState.players || {});
  const playerRemoved = previousPlayerIds.some(id=>!playerIds.includes(id));
  previousPlayerIds = playerIds;

  // 初回接続では過去の投球・交代を再演しない。リセット時は待機中の演出も破棄する。
  if(!outputInitialized || resetId !== lastResetId || playerRemoved){
    cancelOutputPlayback();
    outputInitialized = true;
    lastResetId = resetId;
    lastEffectId = Number(state.effectId || 0);
    lastChangeId = Number(state.changeId || 0);
    seenHistoryIds = new Set(history.map(h=>String(h.id)));
    renderOutputState(gameState);
    return;
  }

  const newThrows = history.filter(h=>!seenHistoryIds.has(String(h.id)));
  const {history:storedHistory,...withoutHistory} = gameState;
  const snapshot = JSON.parse(JSON.stringify(withoutHistory));
  for(const h of newThrows){
    seenHistoryIds.add(String(h.id));
    outputQueue.push({kind:"throw",event:h,snapshot});
  }

  // 更新前のINPUTとの接続でも、得点演出→交代の順序を維持する。
  const effectId = Number(state.effectId || 0);
  const changeId = Number(state.changeId || 0);
  if(!newThrows.length && effectId && effectId !== lastEffectId){
    outputQueue.push({kind:"legacy",snapshot,
      change:!!changeId && changeId !== lastChangeId});
  }else if(!newThrows.length && changeId && changeId !== lastChangeId){
    outputQueue.push({kind:"change",snapshot});
  }
  lastEffectId = effectId;
  lastChangeId = changeId;

  if(outputQueue.length){
    runOutputQueue();
  }else if(!outputBusy){
    renderOutputState(gameState);
  }
}

function scoreAudioType(type){
  if(type === "bull" || type === "outerBull") return "bull";
  if(type === "triple" || type === "double") return type;
  return "normal";
}

async function runOutputQueue(){
  if(outputBusy){
    return;
  }
  outputBusy = true;
  const generation = outputGeneration;
  try{
    while(outputQueue.length && generation === outputGeneration){
      const item = outputQueue.shift();
      const h = item.event;
      if(item.kind === "change"){
        renderOutputState(item.snapshot);
        await showPlayerChange();
        continue;
      }

      // 3投目の表示中も、投げたプレイヤーとその得点を維持する。
      renderOutputState(item.snapshot,h || null);
      const score = h ? h.score : item.snapshot.state.lastScore;
      const type = h ? h.type : item.snapshot.state.lastType;
      await Promise.all([
        showScoreEffect(score,type),
        playAudio(scoreAudioType(type))
      ]);
      if(generation !== outputGeneration){
        return;
      }

      const needsChange = h ? h.changeId && !h.finished : item.change;
      if(needsChange){
        renderOutputState(stateAfterThrow(item.snapshot,h));
        await showPlayerChange();
      }
    }
  }finally{
    if(generation === outputGeneration){
      outputBusy = false;
      renderOutputState(gameState);
    }
  }
}

function stateAfterThrow(snapshot,h){
  if(!h){
    return snapshot;
  }
  const next = JSON.parse(JSON.stringify(snapshot));
  next.state.currentPlayerId = h.nextPlayerId;
  next.currentTurn = h.nextTurn;
  next.state.lastLabel = h.label;
  if(next.players[h.nextPlayerId]){
    next.players[h.nextPlayerId].turnScore = 0;
  }
  return next;
}

// 待機時間だけでなくanimationendを監視し、各演出を順番に終了させる。
function runVisualAnimation(layer,target,animationName){
  return new Promise(resolve=>{
    let timer;
    let settled = false;
    const finish = ()=>{
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      target.removeEventListener("animationend",onEnd);
      layer.classList.remove("show");
      playbackCancellations.delete(finish);
      resolve();
    };
    const onEnd = event=>{
      if(event.target === target && event.animationName === animationName){
        finish();
      }
    };
    layer.classList.remove("show");
    void layer.offsetWidth;
    target.addEventListener("animationend",onEnd);
    playbackCancellations.add(finish);
    layer.classList.add("show");
    const style = getComputedStyle(target);
    const milliseconds = value=>value.trim().endsWith("ms")
      ? parseFloat(value) : parseFloat(value)*1000;
    const durations = style.animationDuration.split(",").map(milliseconds);
    const delays = style.animationDelay.split(",").map(milliseconds);
    const duration = Math.max(0,...durations.map((d,i)=>d+(delays[i % delays.length] || 0)));
    timer = setTimeout(finish,duration+150);
  });
}

   EFFECT
========================================================= */

function showScoreEffect(score,type){

  const layer =
    document.getElementById(
      "effectLayer"
    );

  const text =
    document.getElementById(
      "effectText"
    );


  if(type === "bull"){
    text.textContent = "BULL";
  }

  else if(type === "outerBull"){
    text.textContent = "25";
  }

  else if(type === "triple"){
    text.textContent = "TRIPLE";
  }

  else if(type === "double"){
    text.textContent = "DOUBLE";
  }

  else{
    /*
      通常得点は小さめの演出
    */

    text.textContent =
      "+" + score;
  }


  return runVisualAnimation(layer,layer,"effectFade");

}

function showPlayerChange(){

  return Promise.all([

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/*
  ファイル選択
*/

function setupAudioInput(id,key){

  document.getElementById(id)
    .addEventListener(
      "change",
      event=>{

        const file =
          event.target.files[0];

        if(!file){
          return;
        }

        /*
          以前のURLを解放
        */

        if(audioFiles[key]){
          URL.revokeObjectURL(
            audioFiles[key]
          );
        }


        const url =
          URL.createObjectURL(file);

        audioFiles[key] = url;

        audioElements[key].src =
          url;

        audioElements[key].load();


        document.getElementById(
          "audioStatus"
        ).textContent =
          key.toUpperCase()
          + " の音声を設定しました";

      }
    );

}

/*
  音声再生

  OUTPUT端末でのみ実行。
*/

function playAudio(type){
  const audio = audioElements[type];
  if(selectedRole !== "output" || !audio || !audio.src){
    return Promise.resolve();
  }

  return new Promise(resolve=>{
    let timer;
    let settled = false;
    const endEvents = ["ended","error","abort","emptied"];
    const finish = ()=>{
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      endEvents.forEach(event=>audio.removeEventListener(event,finish));
      audio.removeEventListener("loadedmetadata",watchDuration);
      audio.removeEventListener("pause",onPause);
      playbackCancellations.delete(finish);
      if(!audio.paused && !audio.ended) audio.pause();
      setTimeout(resolve,0);
    };
    const onPause = ()=>{
      if(audio.paused) finish();
    };
    const watchDuration = ()=>{
      clearTimeout(timer);
      const remaining = audio.duration-audio.currentTime;
      timer = setTimeout(finish,Number.isFinite(remaining)
        ? Math.max(0,remaining)*1000+2000 : 30000);
    };

    try{
      audio.pause();
      audio.currentTime = 0;
      endEvents.forEach(event=>audio.addEventListener(event,finish));
      audio.addEventListener("loadedmetadata",watchDuration);
      audio.addEventListener("pause",onPause);
      playbackCancellations.add(finish);
      // 音声未読込・自動再生拒否でも交代処理を停止させない。
      timer = setTimeout(finish,10000);
      const promise = audio.play();
      if(promise){
        promise.then(()=>{
          if(!settled) watchDuration();
        }).catch(finish);
      }else{
        watchDuration();
      }
    }catch(error){
      finish();
    }
  });
}

*/

document.getElementById(
  "outputScreen"
).addEventListener(
  "pointerdown",
  ()=>{
    Object.values(
      audioElements
    ).forEach(audio=>{

      /*
        一瞬play→pauseして
        ブラウザに音声再生許可を与える。
      */

      if(audio.src){

        audio.play()
          .then(()=>{
            audio.pause();
            audio.currentTime=0;
          })
          .catch(()=>{});

      }

    });

  },
  {once:true}
);

function renderThrowHistory(){
  const history = getThrowHistory().slice().reverse();
  document.getElementById("historyNote").textContent = history.length
    ? history.length+"投を新しい順に表示しています。スコアリセットで履歴も消去されます。"
    : "履歴はありません。この版で入力した投球から、一投ずつ記録されます。";
  document.getElementById("throwHistoryRows").innerHTML = history.map(h=>`
    <tr>
      <td>${escapeHTML(h.turn)}</td>
      <td>${escapeHTML(h.throwNumber)}投目</td>
      <td>${escapeHTML(h.playerName)}</td>
      <td>${escapeHTML(h.label)}</td>
      <td class="historyPoints">+${Number(h.score || 0)}</td>
      <td class="historyPoints">${Number(h.total || 0)}</td>
    </tr>
  `).join("");
}

const historyDialog = document.getElementById("throwHistoryDialog");
document.querySelectorAll("[data-open-history]").forEach(button=>{
  button.addEventListener("click",()=>{
    renderThrowHistory();
    if(!historyDialog.open) historyDialog.showModal();
  });
});
document.getElementById("closeHistoryButton").addEventListener("click",()=>{
  historyDialog.close();
});
